name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: legalir demo
      - run: legalir replay --input examples/replay_input.jsonl --mode 06a_strict --output outputs/ci-replay
      - run: legalir evaluate --predictions outputs/ci-replay/predictions.json --gold examples/gold.json
  training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[train]"
      - run: python -m unittest discover -s tests -v
