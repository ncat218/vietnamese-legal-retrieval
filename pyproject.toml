[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-legal-retrieval"
version = "0.1.0"
description = "Vietnamese legal retrieval: multi-source fusion, evidence selection, and audited ranking policies"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ncat218"}]
dependencies = []

[project.optional-dependencies]
train = ["lightgbm==4.6.0", "numpy>=1.26,<3"]

[project.scripts]
legalir = "legalir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legalir = ["data/*.jsonl", "data/*.json"]
