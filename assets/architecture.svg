<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1400" height="750" rx="20" fill="#f4f7f8"/><text x="40" y="55" font-size="32" fill="#0f172a" font-weight="700">Two ranking paths, one final Top5</text><text x="40" y="88" font-size="17" fill="#334155" font-weight="400">Historical 05A / 06A architecture: shortlist quality and inherited final scores are separate dependencies.</text><text x="40" y="151" font-size="14" fill="#0f766e" font-weight="700">CANDIDATE &amp; SHORTLIST PATH</text><rect x="40" y="180" width="230" height="142" rx="16" fill="white" stroke="#cbd5e1"/><rect x="40" y="200" width="4" height="102" rx="2" fill="#0f766e"/><text x="60" y="214" font-size="19" fill="#0f172a" font-weight="650">Three retrieval lanes</text><text x="60" y="243" font-size="15" fill="#334155" font-weight="400">BM25 · BGE-M3 · DEk21</text><text x="60" y="267" font-size="15" fill="#334155" font-weight="400">Natural Top200 per lane</text><text x="60" y="291" font-size="15" fill="#334155" font-weight="400">No gold insertion</text><rect x="310" y="180" width="210" height="142" rx="16" fill="white" stroke="#cbd5e1"/><rect x="310" y="200" width="4" height="102" rx="2" fill="#0f766e"/><text x="330" y="214" font-size="19" fill="#0f172a" font-weight="650">RRF → Top50</text><text x="330" y="243" font-size="15" fill="#334155" font-weight="400">Equal source weights</text><text x="330" y="267" font-size="15" fill="#334155" font-weight="400">1 / (60 + source rank)</text><text x="330" y="291" font-size="15" fill="#334155" font-weight="400">Document-ID tie break</text><rect x="560" y="180" width="240" height="142" rx="16" fill="white" stroke="#cbd5e1"/><rect x="560" y="200" width="4" height="102" rx="2" fill="#0f766e"/><text x="580" y="214" font-size="19" fill="#0f172a" font-weight="650">Jina v3.5</text><text x="580" y="243" font-size="15" fill="#334155" font-weight="400">Joint-list Top50 scoring</text><text x="580" y="267" font-size="15" fill="#334155" font-weight="400">Title + selected chunks</text><text x="580" y="291" font-size="15" fill="#334155" font-weight="400">Pinned model / evidence</text><rect x="840" y="180" width="240" height="142" rx="16" fill="white" stroke="#cbd5e1"/><rect x="840" y="200" width="4" height="102" rx="2" fill="#0f766e"/><text x="860" y="214" font-size="19" fill="#0f172a" font-weight="650">04B LambdaMART</text><text x="860" y="243" font-size="15" fill="#334155" font-weight="400">Retrieval + Jina features</text><text x="860" y="267" font-size="15" fill="#334155" font-weight="400">Frozen shortlist ranker</text><text x="860" y="291" font-size="15" fill="#334155" font-weight="400">Select Top15</text><rect x="1120" y="180" width="235" height="142" rx="16" fill="white" stroke="#cbd5e1"/><rect x="1120" y="200" width="4" height="102" rx="2" fill="#0f766e"/><text x="1140" y="214" font-size="19" fill="#0f172a" font-weight="650">Top15 document IDs</text><text x="1140" y="243" font-size="15" fill="#334155" font-weight="400">Final candidates</text><text x="1140" y="267" font-size="15" fill="#334155" font-weight="400">Check inherited coverage</text><text x="1140" y="291" font-size="15" fill="#334155" font-weight="400">Backfill required in 06A</text><path d="M270 250 H305" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 250 H555" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M800 250 H835" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1080 250 H1115" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="409" font-size="14" fill="#8a661c" font-weight="700">INHERITED SCORE &amp; DECISION PATH</text><rect x="40" y="440" width="300" height="142" rx="16" fill="white" stroke="#cbd5e1"/><rect x="40" y="460" width="4" height="102" rx="2" fill="#c79535"/><text x="60" y="474" font-size="19" fill="#0f172a" font-weight="650">17C / 17D context</text><text x="60" y="503" font-size="15" fill="#334155" font-weight="400">Protected multi-source pool</text><text x="60" y="527" font-size="15" fill="#334155" font-weight="400">Qwen evidence and scores</text><text x="60" y="551" font-size="15" fill="#334155" font-weight="400">14A baseline anchors</text><rect x="395" y="440" width="300" height="142" rx="16" fill="white" stroke="#cbd5e1"/><rect x="395" y="460" width="4" height="102" rx="2" fill="#c79535"/><text x="415" y="474" font-size="19" fill="#0f172a" font-weight="650">Frozen 17E ensemble</text><text x="415" y="503" font-size="15" fill="#334155" font-weight="400">Retrieval + Qwen features</text><text x="415" y="527" font-size="15" fill="#334155" font-weight="400">Full scoring context retained</text><text x="415" y="551" font-size="15" fill="#334155" font-weight="400">Required pairs completed</text><rect x="760" y="440" width="310" height="142" rx="16" fill="white" stroke="#cbd5e1"/><rect x="760" y="460" width="4" height="102" rx="2" fill="#c79535"/><text x="780" y="474" font-size="19" fill="#0f172a" font-weight="650">Final selection</text><text x="780" y="503" font-size="15" fill="#334155" font-weight="400">Keep exact baseline Top2</text><text x="780" y="527" font-size="15" fill="#334155" font-weight="400">Fill 3 slots from Top15</text><text x="780" y="551" font-size="15" fill="#334155" font-weight="400">Use 17E scores + fixed ties</text><rect x="1120" y="440" width="235" height="142" rx="16" fill="white" stroke="#cbd5e1"/><rect x="1120" y="460" width="4" height="102" rx="2" fill="#c79535"/><text x="1140" y="474" font-size="19" fill="#0f172a" font-weight="650">Top5</text><text x="1140" y="503" font-size="15" fill="#334155" font-weight="400">Unique document IDs</text><text x="1140" y="527" font-size="15" fill="#334155" font-weight="400">Score / fallback audit</text><text x="1140" y="551" font-size="15" fill="#334155" font-weight="400">Validated submission</text><path d="M340 510 H390" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M695 510 H755" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1070 510 H1115" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1237 322 V370 H915 V435" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="955" y="359" font-size="14" fill="#334155" font-weight="400">shortlist IDs</text><path d="M170 582 V624 H880 V587" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="355" y="650" font-size="15" fill="#334155" font-weight="400">Exact protected prefix from the inherited baseline</text><text x="40" y="705" font-size="16" fill="#334155" font-weight="400">05A: any missing shortlist score → whole-query baseline fallback.    06A: backfill first; incomplete scores stop inference.</text></g></svg>